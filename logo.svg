<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="solBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9945FF" />
      <stop offset="50%" stop-color="#14F195" />
      <stop offset="100%" stop-color="#00C2FF" />
    </linearGradient>
    <linearGradient id="solBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b111c" />
      <stop offset="100%" stop-color="#05070d" />
    </linearGradient>
    <linearGradient id="bladeLeftUp" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C2FF" />
      <stop offset="40%" stop-color="#14F195" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="bladeRightUp" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="40%" stop-color="#9945FF" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Container with Solana Gradient Border -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#solBorder)" />
  <rect x="24" y="24" width="464" height="464" rx="102" fill="url(#solBg)" />

  <!-- Center Ambient Radial Glow -->
  <circle cx="256" cy="230" r="150" fill="#14F195" opacity="0.1" />

  <!-- Crossed Swords Pointing UPWARD -->
  <g filter="url(#neonGlow)">
    <!-- SWORD 1: Hilt Bottom-Left, Blade Pointing Up-Right -->
    <!-- Blade -->
    <path d="M165 330 L380 115 L405 90 L395 140 L180 355 Z" fill="url(#bladeLeftUp)" />
    <!-- Tip Polygon -->
    <polygon points="405,90 365,110 395,140" fill="#ffffff" />
    <!-- Center fuller line -->
    <line x1="185" y1="330" x2="385" y2="115" stroke="#ffffff" stroke-width="3" opacity="0.9" />
    <!-- Crossguard (Bottom-Left) -->
    <line x1="120" y1="310" x2="210" y2="400" stroke="#14F195" stroke-width="16" stroke-linecap="round" />
    <circle cx="120" cy="310" r="10" fill="#ffffff" />
    <circle cx="210" cy="400" r="10" fill="#ffffff" />
    <!-- Handle / Grip -->
    <line x1="150" y1="370" x2="100" y2="420" stroke="#e2e8f0" stroke-width="14" stroke-linecap="round" />
    <!-- Pommel -->
    <circle cx="95" cy="425" r="16" fill="#14F195" stroke="#ffffff" stroke-width="3" />

    <!-- SWORD 2: Hilt Bottom-Right, Blade Pointing Up-Left -->
    <!-- Blade -->
    <path d="M347 330 L132 115 L107 90 L117 140 L332 355 Z" fill="url(#bladeRightUp)" />
    <!-- Tip Polygon -->
    <polygon points="107,90 147,110 117,140" fill="#ffffff" />
    <!-- Center fuller line -->
    <line x1="327" y1="330" x2="127" y2="115" stroke="#ffffff" stroke-width="3" opacity="0.9" />
    <!-- Crossguard (Bottom-Right) -->
    <line x1="392" y1="310" x2="302" y2="400" stroke="#9945FF" stroke-width="16" stroke-linecap="round" />
    <circle cx="392" cy="310" r="10" fill="#ffffff" />
    <circle cx="302" cy="400" r="10" fill="#ffffff" />
    <!-- Handle / Grip -->
    <line x1="362" y1="370" x2="412" y2="420" stroke="#e2e8f0" stroke-width="14" stroke-linecap="round" />
    <!-- Pommel -->
    <circle cx="417" cy="425" r="16" fill="#9945FF" stroke="#ffffff" stroke-width="3" />

    <!-- Central Power Core / Shield at Sword Intersection (256, 256) -->
    <circle cx="256" cy="256" r="30" fill="#0b111c" stroke="url(#solBorder)" stroke-width="6" />
    <polygon points="256,234 274,256 256,278 238,256" fill="#14F195" />
    <circle cx="256" cy="256" r="6" fill="#ffffff" />
  </g>
</svg>