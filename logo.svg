<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="solBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9945FF" />
      <stop offset="50%" stop-color="#14F195" />
      <stop offset="100%" stop-color="#00C2FF" />
    </linearGradient>
    <linearGradient id="solBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c121d" />
      <stop offset="100%" stop-color="#05080e" />
    </linearGradient>
    <linearGradient id="bladeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#14F195" />
    </linearGradient>
    <linearGradient id="bladeGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f3e8ff" />
      <stop offset="100%" stop-color="#9945FF" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Container with Solana Gradient Border -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#solBorder)" />
  <rect x="24" y="24" width="464" height="464" rx="102" fill="url(#solBg)" />

  <!-- Subtle Radial Glow in Center -->
  <circle cx="256" cy="256" r="140" fill="#14F195" opacity="0.08" />

  <!-- Crossed Swords Graphic with High Detail -->
  <g filter="url(#neonGlow)">
    <!-- Sword 1 (Top-Left to Bottom-Right) -->
    <!-- Blade -->
    <path d="M120 120 L370 370 L390 350 L140 100 Z" fill="url(#bladeGrad1)" />
    <!-- Tip -->
    <polygon points="370,370 410,390 390,350" fill="#14F195" />
    <!-- Ridge line -->
    <line x1="130" y1="110" x2="380" y2="360" stroke="#ffffff" stroke-width="3" opacity="0.8" />
    <!-- Guard -->
    <line x1="90" y1="150" x2="150" y2="90" stroke="#14F195" stroke-width="16" stroke-linecap="round" />
    <circle cx="90" cy="150" r="10" fill="#ffffff" />
    <circle cx="150" cy="90" r="10" fill="#ffffff" />
    <!-- Grip & Pommel -->
    <line x1="105" y1="105" x2="65" y2="65" stroke="#e2e8f0" stroke-width="14" stroke-linecap="round" />
    <circle cx="65" cy="65" r="16" fill="#14F195" />

    <!-- Sword 2 (Top-Right to Bottom-Left) -->
    <!-- Blade -->
    <path d="M392 120 L142 370 L122 350 L372 100 Z" fill="url(#bladeGrad2)" />
    <!-- Tip -->
    <polygon points="142,370 102,390 122,350" fill="#9945FF" />
    <!-- Ridge line -->
    <line x1="382" y1="110" x2="132" y2="360" stroke="#ffffff" stroke-width="3" opacity="0.8" />
    <!-- Guard -->
    <line x1="422" y1="150" x2="362" y2="90" stroke="#9945FF" stroke-width="16" stroke-linecap="round" />
    <circle cx="422" cy="150" r="10" fill="#ffffff" />
    <circle cx="362" cy="90" r="10" fill="#ffffff" />
    <!-- Grip & Pommel -->
    <line x1="407" y1="105" x2="447" y2="65" stroke="#e2e8f0" stroke-width="14" stroke-linecap="round" />
    <circle cx="447" cy="65" r="16" fill="#9945FF" />

    <!-- Central Centerpiece / Power Core -->
    <circle cx="256" cy="256" r="28" fill="#0c121d" stroke="url(#solBorder)" stroke-width="6" />
    <polygon points="256,236 276,256 256,276 236,256" fill="#ffffff" />
  </g>
</svg>