<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pvphub Arena - Official DApp Logo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <style>
    body { font-family: "Inter", sans-serif; background-color: #070c14; color: #f8fafc; }
    .mono { font-family: "JetBrains Mono", monospace; }
  </style>
</head>
<body class="min-h-screen p-4 md:p-10 flex flex-col items-center justify-center">
  <div class="max-w-xl w-full space-y-8 text-center">

    <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs mono font-bold">
      OFFICIAL BANNER LOGO • EXACT MATCH ⚔️
    </div>

    <div class="bg-[#0b121e] border border-white/10 rounded-3xl p-8 shadow-2xl flex flex-col items-center space-y-6">
      <!-- The Exact Banner Mark -->
      <img src="logo-large.png?v=banner" alt="pvphub Exact Banner Logo" class="w-64 h-64 rounded-3xl shadow-2xl object-contain" />
      
      <div class="space-y-1">
        <h2 class="text-xl font-black text-white mono">Exact Site Banner Mark (⚔️)</h2>
        <p class="text-xs text-gray-400 mono">Gradient: #9945FF to #14F195 | Inner: #0c121d</p>
      </div>

      <div class="flex flex-wrap items-center justify-center gap-3 pt-2">
        <a href="logo-large.png" target="_blank" download class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-[#9945FF] to-[#14F195] text-black font-black text-xs mono hover:opacity-90 transition">
          Download Image (1024x1024 PNG)
        </a>
        <a href="https://pvphub.fun" class="px-5 py-2.5 rounded-xl bg-white/10 hover:bg-white/15 text-white font-bold text-xs mono transition">
          Back to pvphub.fun
        </a>
      </div>
    </div>

  </div>
</body>
</html>
